name: Github CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Manual Submodule Setup
      run: |
        mkdir -p plugin
        cd plugin
        git clone --recursive https://github.com/Cxbx-Reloaded/XbSymbolDatabase.git XbSymbolDatabase
        git clone --recursive https://github.com/JayFoxRox/nxdk.git nxdk
        cd nxdk
        git checkout dxt

    - name: Debug - Check XbSymbolDatabase headers
      run: |
        echo "=== Checking for XbSymbolDatabase.h ==="
        find plugin/XbSymbolDatabase -name "*.h" | head -10
        echo ""
        echo "=== XbSymbolDatabase include directory ==="
        ls -la plugin/XbSymbolDatabase/include/ 2>/dev/null || echo "include directory not found"

    - name: install deps
      run: |
        sudo apt-get update -y && sudo apt-get install -y build-essential libc6-dev flex bison
        wget -O - https://apt.llvm.org/llvm.sh > llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 8
        sudo apt-get install -y clang-8 lld-8

    - name: build cdxt
      working-directory: ./plugin/nxdk/tools/cxbe
      run: make

    - name: build CheatX
      working-directory: ./plugin
      run: |
        export PATH=$PATH:/usr/bin
        export CFLAGS="-Wno-implicit-function-declaration -I./XbSymbolDatabase/include"
        export CXXFLAGS="-Wno-implicit-function-declaration -I./XbSymbolDatabase/include"
        make CC=clang-8 CXX=clang++-8 AS=clang-8 LD="lld-8 -flavor link"
