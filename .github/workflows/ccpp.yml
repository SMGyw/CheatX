name: Github CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Manual Submodule Setup
      run: |
        mkdir -p plugin
        cd plugin
        git clone https://github.com/XboxDev/XbSymbolDatabase.git XbSymbolDatabase
        git clone https://github.com/JayFoxRox/nxdk.git nxdk
        cd nxdk
        git checkout dxt

    - name: install deps
      run: sudo apt-get update -y && sudo apt-get install -y flex bison clang-8 lld-8

    - name: build cdxt
      working-directory: ./plugin/nxdk/tools/cxbe
      run: make

    - name: build CheatX
      working-directory: ./plugin
      run: |
        export PATH=$PATH:/usr/lib/llvm-8/bin
        make

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CheatX-Build
        path: plugin/bin/
