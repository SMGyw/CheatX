name: Github CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Manual Submodule Setup
      run: |
        mkdir -p plugin
        cd plugin
        git clone https://github.com/Cxbx-Reloaded/XbSymbolDatabase.git XbSymbolDatabase
        git clone --recursive https://github.com/JayFoxRox/nxdk.git nxdk
        cd nxdk
        git checkout dxt

    - name: install deps
      run: sudo apt-get update -y && sudo apt-get install -y build-essential libc6-dev flex bison clang lld

    - name: build cdxt
      working-directory: ./plugin/nxdk/tools/cxbe
      run: make

    - name: build CheatX
      working-directory: ./plugin
      run: |
        export PATH=$PATH:/usr/bin
        export CFLAGS="-Wno-implicit-function-declaration"
        export CXXFLAGS="-Wno-implicit-function-declaration"
        make

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CheatX-Build
        path: plugin/bin/
